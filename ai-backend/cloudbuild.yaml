# Cloud Build: build and deploy gateway + ai-backend + Pub/Sub worker to Cloud Run.
# Cost controls: scale-to-zero, low max instances, Flash model, no Redis/Memorystore.
substitutions:
  _REGION: us-central1
  _PUBSUB_TOPIC: devmind-pr-jobs
  _PUBSUB_SUBSCRIPTION: devmind-pr-worker
  _PUBSUB_DLQ_TOPIC: devmind-pr-jobs-dlq
  _PUBSUB_DLQ_SUBSCRIPTION: devmind-pr-jobs-dlq

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/gateway:${BUILD_ID}
      - -f
      - gateway.Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/ai-backend:${BUILD_ID}
      - -f
      - ai-backend/Dockerfile
      - ai-backend

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/ai-worker:${BUILD_ID}
      - -f
      - ai-backend/worker.Dockerfile
      - ai-backend

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/gateway:${BUILD_ID}

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/ai-backend:${BUILD_ID}

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/ai-worker:${BUILD_ID}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        SECRET_FLAGS=()
        if gcloud secrets describe GITHUB_WEBHOOK_SECRET --project="${PROJECT_ID}" >/dev/null 2>&1; then
          SECRET_FLAGS+=(--set-secrets=GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest)
        else
          echo "WARNING: Secret Manager secret GITHUB_WEBHOOK_SECRET is missing; create it before receiving GitHub webhooks."
        fi
        gcloud run deploy devmind-gateway \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/gateway:${BUILD_ID} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=devmind-ai@${PROJECT_ID}.iam.gserviceaccount.com \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=2 \
          --timeout=30 \
          --concurrency=80 \
          --cpu-throttling \
          --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},QUEUE_BACKEND=pubsub,PUBSUB_TOPIC=${_PUBSUB_TOPIC} \
          "$${SECRET_FLAGS[@]}"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - devmind-ai-backend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/ai-backend:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --service-account=devmind-ai@${PROJECT_ID}.iam.gserviceaccount.com
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=2
      - --cpu-throttling
      - --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},USE_GCP_SECRETS=true,USE_GCP_LOGGING=true,USE_GCP_TRACING=true,DEFAULT_LLM_PROVIDER=vertex,VERTEX_MODEL=gemini-2.5-flash

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - devmind-ai-worker
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/ai-worker:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --service-account=devmind-ai@${PROJECT_ID}.iam.gserviceaccount.com
      - --cpu=1
      - --memory=1Gi
      - --min-instances=0
      - --max-instances=2
      - --concurrency=1
      - --timeout=180
      - --cpu-throttling
      - --set-env-vars=GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION},USE_GCP_SECRETS=true,USE_GCP_LOGGING=true,USE_GCP_TRACING=false,QUEUE_BACKEND=pubsub,DEFAULT_LLM_PROVIDER=vertex,VERTEX_MODEL=gemini-2.5-flash,PR_REVIEW_MAX_OUTPUT_TOKENS=4096

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        WORKER_URL="$$(gcloud run services describe devmind-ai-worker --region=${_REGION} --format='value(status.url)')"
        PROJECT_NUMBER="$$(gcloud projects describe ${PROJECT_ID} --format='value(projectNumber)')"
        INVOKER_SA="devmind-pubsub-invoker@${PROJECT_ID}.iam.gserviceaccount.com"
        RUNTIME_SA="devmind-ai@${PROJECT_ID}.iam.gserviceaccount.com"
        PUBSUB_SA="service-$${PROJECT_NUMBER}@gcp-sa-pubsub.iam.gserviceaccount.com"

        gcloud iam service-accounts create devmind-pubsub-invoker \
          --display-name="Pub/Sub Cloud Run invoker" \
          --project="${PROJECT_ID}" \
          2>/dev/null || echo "Invoker service account already exists"

        gcloud run services add-iam-policy-binding devmind-ai-worker \
          --region=${_REGION} \
          --member="serviceAccount:$${INVOKER_SA}" \
          --role="roles/run.invoker" \
          --quiet

        # IAM on service accounts / topics is one-time project setup
        # (scripts/gcp/setup-project.sh). Cloud Build's default Compute SA
        # typically cannot set those policies.
        warn_if_denied() {
          local desc="$$1"
          shift
          if "$$@"; then
            echo "OK: $${desc}"
          else
            echo "WARNING: skipped $${desc} (Cloud Build SA lacks permission)."
            echo "If Pub/Sub push is not wired, run: scripts/gcp/setup-project.sh ${PROJECT_ID}"
          fi
        }

        warn_if_denied "tokenCreator on invoker SA" \
          gcloud iam service-accounts add-iam-policy-binding "$${INVOKER_SA}" \
            --project="${PROJECT_ID}" \
            --member="serviceAccount:$${PUBSUB_SA}" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --quiet

        gcloud pubsub topics create ${_PUBSUB_TOPIC} \
          --project="${PROJECT_ID}" \
          2>/dev/null || echo "Topic ${_PUBSUB_TOPIC} already exists"

        gcloud pubsub topics create ${_PUBSUB_DLQ_TOPIC} \
          --project="${PROJECT_ID}" \
          2>/dev/null || echo "Topic ${_PUBSUB_DLQ_TOPIC} already exists"

        gcloud pubsub subscriptions create ${_PUBSUB_DLQ_SUBSCRIPTION} \
          --topic=${_PUBSUB_DLQ_TOPIC} \
          --project="${PROJECT_ID}" \
          2>/dev/null || echo "Subscription ${_PUBSUB_DLQ_SUBSCRIPTION} already exists"

        warn_if_denied "publisher on topic ${_PUBSUB_TOPIC}" \
          gcloud pubsub topics add-iam-policy-binding ${_PUBSUB_TOPIC} \
            --member="serviceAccount:$${RUNTIME_SA}" \
            --role="roles/pubsub.publisher" \
            --quiet

        warn_if_denied "DLQ publisher for Pub/Sub service agent" \
          gcloud pubsub topics add-iam-policy-binding ${_PUBSUB_DLQ_TOPIC} \
            --member="serviceAccount:$${PUBSUB_SA}" \
            --role="roles/pubsub.publisher" \
            --quiet

        if gcloud pubsub subscriptions describe ${_PUBSUB_SUBSCRIPTION} --project="${PROJECT_ID}" >/dev/null 2>&1; then
          warn_if_denied "push subscription update" \
            gcloud pubsub subscriptions update ${_PUBSUB_SUBSCRIPTION} \
              --push-endpoint="$${WORKER_URL}/pubsub" \
              --push-auth-service-account="$${INVOKER_SA}" \
              --push-auth-token-audience="$${WORKER_URL}" \
              --ack-deadline=120 \
              --min-retry-delay=10s \
              --max-retry-delay=120s \
              --dead-letter-topic=projects/${PROJECT_ID}/topics/${_PUBSUB_DLQ_TOPIC} \
              --max-delivery-attempts=5
        else
          warn_if_denied "push subscription create" \
            gcloud pubsub subscriptions create ${_PUBSUB_SUBSCRIPTION} \
              --topic=${_PUBSUB_TOPIC} \
              --project="${PROJECT_ID}" \
              --push-endpoint="$${WORKER_URL}/pubsub" \
              --push-auth-service-account="$${INVOKER_SA}" \
              --push-auth-token-audience="$${WORKER_URL}" \
              --ack-deadline=120 \
              --min-retry-delay=10s \
              --max-retry-delay=120s \
              --dead-letter-topic=projects/${PROJECT_ID}/topics/${_PUBSUB_DLQ_TOPIC} \
              --max-delivery-attempts=5
        fi

        warn_if_denied "subscriber on ${_PUBSUB_SUBSCRIPTION} for DLQ forwarding" \
          gcloud pubsub subscriptions add-iam-policy-binding ${_PUBSUB_SUBSCRIPTION} \
            --member="serviceAccount:$${PUBSUB_SA}" \
            --role="roles/pubsub.subscriber" \
            --quiet

        echo "Pub/Sub push configured: $${WORKER_URL}/pubsub"

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/gateway:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/ai-backend:${BUILD_ID}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/ai-worker:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
