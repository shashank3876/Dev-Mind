# Build and deploy the React frontend to Cloud Run.
# /api is proxied to the Express api-server (auth, chats, saved PR reviews).
substitutions:
  _REGION: us-central1
  _VITE_API_URL: https://devmind-ai-backend-nvnmzcvgva-uc.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/frontend:${BUILD_ID}
      - -f
      - frontend.Dockerfile
      - --build-arg
      - VITE_API_URL=${_VITE_API_URL}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/frontend:${BUILD_ID}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - devmind-frontend
      - --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/frontend:${BUILD_ID}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --cpu=1
      - --memory=256Mi
      - --min-instances=0
      - --max-instances=2
      - --cpu-throttling
      - --set-env-vars=API_SERVER_URL=https://devmind-api-server-24602646156.us-central1.run.app

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/devmind/frontend:${BUILD_ID}

options:
  logging: CLOUD_LOGGING_ONLY
