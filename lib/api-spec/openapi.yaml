openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: chat
    description: Chat operations
  - name: billing
    description: Billing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get current user
      description: Returns the authenticated user, or null when not signed in
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
  /auth/logout:
    post:
      operationId: authLogout
      tags: [auth]
      summary: Log out
      description: Destroys the current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLogoutResponse"
  /chat/usage:
    get:
      operationId: getChatUsage
      tags: [chat]
      summary: Get chat usage
      description: Returns monthly chat usage for the authenticated user
      responses:
        "200":
          description: Usage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatUsageResponse"
        "401":
          description: Not authenticated
  /chat:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send chat message
      description: Sends a chat message via the authenticated proxy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
      responses:
        "200":
          description: SSE stream
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Not authenticated
        "402":
          description: Quota exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuotaExceededResponse"
  /billing/razorpay/checkout:
    post:
      operationId: createRazorpayCheckout
      tags: [billing]
      summary: Create Razorpay checkout
      responses:
        "200":
          description: Checkout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpayCheckoutResponse"
        "401":
          description: Not authenticated
  /billing/razorpay/verify:
    post:
      operationId: verifyRazorpayPayment
      tags: [billing]
      summary: Verify Razorpay payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RazorpayVerifyRequest"
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RazorpayVerifyResponse"
        "401":
          description: Not authenticated
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
      required:
        - id
        - email
        - name
        - avatarUrl
    AuthMeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      required:
        - user
    AuthLogoutResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    ChatUsageResponse:
      type: object
      properties:
        used:
          type: integer
        limit:
          type: integer
        remaining:
          type: integer
        canSend:
          type: boolean
        resetsAt:
          type: string
        isSubscribed:
          type: boolean
      required:
        - used
        - limit
        - remaining
        - canSend
        - resetsAt
        - isSubscribed
    ChatMessageRequest:
      type: object
      properties:
        message:
          type: string
        conversationId:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
      required:
        - message
    QuotaExceededResponse:
      type: object
      properties:
        code:
          type: string
        used:
          type: integer
        limit:
          type: integer
        resetsAt:
          type: string
      required:
        - code
        - used
        - limit
        - resetsAt
    RazorpayCheckoutResponse:
      type: object
      properties:
        orderId:
          type: string
        amount:
          type: integer
        currency:
          type: string
        keyId:
          type: string
        userEmail:
          type: string
      required:
        - orderId
        - amount
        - currency
        - keyId
        - userEmail
    RazorpayVerifyRequest:
      type: object
      properties:
        orderId:
          type: string
        paymentId:
          type: string
        signature:
          type: string
      required:
        - orderId
        - paymentId
        - signature
    RazorpayVerifyResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
